datasource:
  member:
    write:
      driverClassName: com.mysql.jdbc.Driver
      #配置基本属性
      url: jdbc:mysql://rm-8vb9lz6plbbn08o26.mysql.zhangbei.rds.aliyuncs.com:3306/big_xiaomai_member?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&autoReconnect=true&useSSL=false&serverTimezone=GMT%2B8
